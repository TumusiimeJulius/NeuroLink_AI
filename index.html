<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroLink AI — Adaptive Learning Twin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <!-- App Mounting Node -->
  <div id="app"></div>

  <!-- Global Modal for notifications / alerts -->
  <div id="global-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Notification</h3>
        <button id="modal-close-btn" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-message"></p>
      </div>
      <div class="modal-footer">
        <button id="modal-confirm-btn" class="btn btn-primary">Okay</button>
      </div>
    </div>
  </div>

  <!-- Load JavaScript App Entrypoint as module -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
